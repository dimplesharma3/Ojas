<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Golden Amber Gradient -->
    <radialGradient id="oilDropGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFEBB3" />
      <stop offset="25%" stop-color="#F2B824" />
      <stop offset="70%" stop-color="#B37700" />
      <stop offset="100%" stop-color="#593000" />
    </radialGradient>
    
    <!-- Soft Glow / Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#2C1203" flood-opacity="0.25"/>
    </filter>
    
    <!-- Inner Shadow for depth -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="-4"/>
      <feGaussianBlur stdDeviation="5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background/Base shape with gradient and drop shadow -->
  <path d="M50 12 C50 12, 18 55, 18 72 A32 32 0 1 0 82 72 C82 55, 50 12, 50 12 Z" 
        fill="url(#oilDropGrad)" 
        filter="url(#dropShadow)" />

  <!-- Inner depth shadow -->
  <path d="M50 12 C50 12, 18 55, 18 72 A32 32 0 1 0 82 72 C82 55, 50 12, 50 12 Z" 
        fill="none"
        stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.5" />

  <!-- Main Highlight Curve (Left Side) -->
  <path d="M35 50 C28 60, 28 72, 40 82 C32 75, 30 65, 38 52 Z" 
        fill="#FFFFFF" opacity="0.4" filter="blur(2px)"/>

  <!-- Top Intense Reflection -->
  <ellipse cx="40" cy="40" rx="3.5" ry="8" fill="#FFFFFF" opacity="0.8" transform="rotate(-30 40 40)" filter="blur(0.5px)"/>
  
  <!-- Subtle Bottom Right Ambient Bounce -->
  <path d="M60 85 C70 80, 75 70, 72 60 C78 70, 70 82, 55 86 Z" 
        fill="#FFEBB3" opacity="0.5" filter="blur(3px)"/>
</svg>
